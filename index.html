<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>易经64卦查询</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #ffd700; font-size: 24px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #16213e; color: #fff; font-size: 18px; text-align: center; }
        input::placeholder { color: #666; }
        button { padding: 12px 24px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
        button:active { background: #c73e54; }
        .result { background: #16213e; border-radius: 12px; padding: 20px; margin-top: 20px; display: none; }
        .result.show { display: block; }
        .hex-name { font-size: 28px; color: #ffd700; text-align: center; margin-bottom: 10px; }
        .hex-info { text-align: center; color: #aaa; margin-bottom: 15px; }
        .section { margin: 15px 0; padding: 12px; background: #0f3460; border-radius: 8px; }
        .section-title { color: #e94560; font-size: 14px; margin-bottom: 8px; }
        .section-content { font-size: 16px; line-height: 1.6; color: #fff; }
        .mode-toggle { text-align: center; margin: 15px 0; }
        .mode-toggle button { width: auto; padding: 8px 16px; font-size: 14px; background: #16213e; display: inline-block; }
        .mode-toggle button.active { background: #e94560; }
        .direct-input { display: none; }
        .direct-input.show { display: block; }
        select { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #16213e; color: #fff; font-size: 16px; margin-bottom: 10px; }
        .history { margin-top: 20px; }
        .history-item { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .history-item:active { background: #1f2f50; }
        .history-name { color: #ffd700; font-size: 16px; }
        .history-yao { color: #aaa; font-size: 14px; }
        .clear-btn { background: #333; padding: 8px; font-size: 12px; }
        .calc-peace { margin-top: 20px; text-align: center; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>易经64卦查询</h1>
        <div class="mode-toggle">
            <button id="mode3" class="active" onclick="setMode(3)">三位数模式</button>
            <button id="modeDirect" onclick="setMode(0)">直接输入</button>
        </div>
        <div id="input3">
            <div class="input-group">
                <input type="number" id="num1" placeholder="内卦(÷8)" min="1">
                <input type="number" id="num2" placeholder="外卦(÷8)" min="1">
                <input type="number" id="num3" placeholder="爻位(÷6)" min="1">
            </div>
            <button onclick="query3()">查询</button>
        </div>
        <div id="inputDirect" class="direct-input">
            <select id="inner"><option value="">内卦(下卦)</option></select>
            <select id="outer"><option value="">外卦(上卦)</option></select>
            <select id="yao"><option value="">爻位</option></select>
            <button onclick="queryDirect()">查询</button>
        </div>
        <div id="result" class="result"></div>
        <div class="history" id="history"><button class="clear-btn" onclick="clearHistory()">清除历史</button></div>
        <div class="calc-peace">心生智慧，心静则安</div>
    </div>
    <script>
    const TRIGRAMS = [
        {num:1, name:"乾", symbol:"☰"}, {num:2, name:"兑", symbol:"☱"}, {num:3, name:"离", symbol:"☲"},
        {num:4, name:"震", symbol:"☳"}, {num:5, name:"巽", symbol:"☴"}, {num:6, name:"坎", symbol:"☵"},
        {num:7, name:"艮", symbol:"☶"}, {num:8, name:"坤", symbol:"☷"}
    ];
    const YAO_NAMES = ["初九","九二","九三","九四","九五","上九"];
    const HEXAGRAMS = {"1,1": {"index": 1, "name": "乾为天", "gua_ci": "乾：元亨利贞。", "tai_zuan": "大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明始终，六位时成，时乘六龙以御天。乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。", "da_xiang": "天行健，君子以自强不息。", "yao": ["潜龙勿用。", "见龙在田，利见大人。", "君子终日乾乾，夕惕若，厉无咎。", "或跃在渊，无咎。", "飞龙在天，利见大人。", "亢龙有悔。"], "yao_xiao_xiang": ["阳在下也。", "德施普也。", "反复道也。", "进无咎也。", "大人造也。", "盈不可久也。"]}, "8,8": {"index": 2, "name": "坤为地", "gua_ci": "坤：元亨，利牝马之贞。君子有攸往，先迷后得主，利西南得朋，东北丧朋。安贞吉。", "tai_zuan": "至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。", "da_xiang": "地势坤，君子以厚德载物。", "yao": ["履霜，坚冰至。", "直方大，不习无不利。", "含章可贞。或从王事，无成有终。", "括囊；无咎，无誉。", "黄裳，元吉。", "战龙于野，其血玄黄。"], "yao_xiao_xiang": ["阴始凝也。驯致其道，至坚冰也。", "六二之动，直以方也。不习无不利，地道光也。", "含章可贞；以时发也。或从王事，知光大也。", "括囊无咎，慎不害也。", "黄裳元吉，文在中也。", "战龙于野，其道穷也。"]}, "4,6": {"index": 3, "name": "水雷屯", "gua_ci": "屯：元亨利贞，勿用有攸往，利建侯。", "tai_zuan": "屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。", "da_xiang": "云雷屯，君子以经纶。", "yao": ["磐桓；利居贞，利建侯。", "屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。", "既鹿无虞，惟入于林中，君子几不如舍，往吝。", "乘马班如，求婚媾，无不利。", "屯其膏，小贞吉，大贞凶。", "乘马班如，泣血涟如。"], "yao_xiao_xiang": ["虽磐桓，志行正也。以贵下贱，大得民也。", "六二之难，乘刚也。十年乃字，反常也。", "既鹿无虞，以纵禽也。君子舍之，往吝穷也。", "求而往，明也。", "屯其膏，施未光也。", "泣血涟如，何可长也。"]}, "6,7": {"index": 4, "name": "山水蒙", "gua_ci": "蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。", "tai_zuan": "蒙，山下有险，险而止，蒙。蒙亨，以亨行时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。", "da_xiang": "山下出泉，蒙；君子以果行育德。", "yao": ["发蒙，利用刑人，用说桎梏，以往吝。", "包蒙吉；纳妇吉；子克家。", "勿用娶女；见金夫，不有躬，无攸利。", "困蒙，吝。", "童蒙，吉。", "击蒙；不利为寇，利御寇。"], "yao_xiao_xiang": ["利用刑人，以正法也。", "子克家，刚柔接也。", "勿用娶女，行不顺也。", "困蒙之吝，独远实也。", "童蒙之吉，顺以巽也。", "利用御寇，上下顺也。"]}, "1,6": {"index": 5, "name": "水天需", "gua_ci": "需：有孚，光亨，贞吉。利涉大川。", "tai_zuan": "需，须也；险在前也。刚健而不陷，其义不困穷矣。需有孚，光亨，贞吉。位乎天位，以正中也。利涉大川，往有功也。", "da_xiang": "云上于天，需；君子以饮食宴乐。", "yao": ["需于郊。利用恒，无咎。", "需于沙。小有言，终吉。", "需于泥，致寇至。", "需于血，出自穴。", "需于酒食，贞吉。", "入于穴，有不速之客三人来，敬之终吉。"], "yao_xiao_xiang": ["需于郊，不犯难行也。利用恒，无咎；未失常也。", "需于沙，衍在中也。虽小有言，以终吉也。", "需于泥，灾在外也。自我致寇，敬慎不败也。", "需于血，顺以听也。", "酒食贞吉，以中正也。", "不速之客来，敬之终吉。虽不当位，未大失也。"]}, "6,1": {"index": 6, "name": "天水讼", "gua_ci": "讼：有孚，窒。惕中吉。终凶。利见大人，不利涉大川。", "tai_zuan": "讼，上刚下险，险而健讼。讼有孚窒，惕中吉，刚来而得中也。终凶；讼不可成也。利见大人；尚中正也。不利涉大川；入于渊也。", "da_xiang": "天与水违行，讼；君子以作事谋始。", "yao": ["不永所事，小有言，终吉。", "不克讼，归而逋，其邑人三百户，无眚。", "食旧德，贞厉，终吉，或从王事，无成。", "不克讼，复自命，渝安贞，吉。", "讼元吉。", "或锡之鞶带，终朝三褫之。"], "yao_xiao_xiang": ["不永所事，讼不可长也。虽有小言，其辩明也。", "不克讼，归而逋也。自下讼上，患至掇也。", "食旧德，从上吉也。", "复即命，渝安贞；不失也。", "讼元吉，以中正也。", "以讼受服，亦不足敬也。"]}, "6,8": {"index": 7, "name": "地水师", "gua_ci": "师：贞，丈人，吉无咎。", "tai_zuan": "师，众也，贞正也，能以众正，可以王矣。刚中而应，行险而顺，以此毒天下，而民从之，吉又何咎矣。", "da_xiang": "地中有水，师；君子以容民畜众。", "yao": ["师出以律，否臧凶。", "在师中，吉无咎，王三锡命。", "师或舆尸，凶。", "师左次，无咎。", "田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。", "大君有命，开国承家，小人勿用。"], "yao_xiao_xiang": ["师出以律，失律凶也。", "在师中吉，承天宠也。王三锡命，怀万邦也。", "师或舆尸，大无功也。", "左次无咎，未失常也。", "长子帅师，以中行也。弟子舆师，使不当也。", "大君有命，以正功也。小人勿用，必乱邦也。"]}, "8,6": {"index": 8, "name": "水地比", "gua_ci": "比：吉。原筮元永贞，无咎。不宁方来，后夫凶。", "tai_zuan": "比，吉也，比，辅也，下顺从也。原筮元永贞，无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。", "da_xiang": "地上有水，比；先王以建万国，亲诸侯。", "yao": ["有孚比之，无咎。有孚盈缶，终来有他，吉。", "比自内，贞吉。", "比之匪人。", "外比之，贞吉。", "显比，王用三驱，失前禽。邑人不诫，吉。", "比之无首，凶。"], "yao_xiao_xiang": ["比之初六，有他吉也。", "比之自内，不自失也。", "比之匪人，不亦伤乎！", "外比于贤，以从上也。", "显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。", "比之无首，无所终也。"]}, "1,5": {"index": 9, "name": "风天小畜", "gua_ci": "小畜：亨。密云不雨，自我西郊。", "tai_zuan": "小畜；柔得位，而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。", "da_xiang": "风行天上，小畜；君子以懿文德。", "yao": ["复自道，何其咎，吉。", "牵复，吉。", "舆说辐，夫妻反目。", "有孚，血去惕出，无咎。", "有孚挛如，富以其邻。", "既雨既处，尚德载，妇贞厉。月几望，君子征凶。"], "yao_xiao_xiang": ["复自道，其义吉也。", "牵复在中，亦不自失也。", "夫妻反目，不能正室也。", "有孚惕出，上合志也。", "有孚挛如，不独富也。", "既雨既处，德积载也。君子征凶，有所疑也。"]}, "2,1": {"index": 10, "name": "天泽履", "gua_ci": "履：履虎尾，不咥人，亨。", "tai_zuan": "履，柔履刚也。说而应乎乾，是以履虎尾，不咥人，亨。刚中正，履帝位而不疚，光明也。", "da_xiang": "上天下泽，履；君子以辨上下，安民志。", "yao": ["素履，往无咎。", "履道坦坦，幽人贞吉。", "眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。", "履虎尾，愬愬终吉。", "夬履，贞厉。", "视履考祥，其旋元吉。"], "yao_xiao_xiang": ["素履之往，独行愿也。", "幽人贞吉，中不自乱也。", "眇能视；不足以有明也。跛能履；不足以与行也。咥人之凶；位不当也。武人为于大君；志刚也。", "愬愬终吉，志行也。", "夬履贞厉，位正当也。", "元吉在上，大有庆也。"]}, "1,8": {"index": 11, "name": "地天泰", "gua_ci": "泰：小往大来，吉亨。", "tai_zuan": "泰，小往大来，吉亨。则是天地交，而万物通也；上下交，而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。", "da_xiang": "天地交泰，后以财成天地之道，辅相天地之宜，以左右民。", "yao": ["拔茅茹，以其汇，征吉。", "包荒，用冯河，不遐遗，朋亡，得尚于中行。", "无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。", "翩翩不富，以其邻，不戒以孚。", "帝乙归妹，以祉元吉。", "城复于隍，勿用师。自邑告命，贞吝。"], "yao_xiao_xiang": ["拔茅征吉，志在外也。", "包荒，得尚于中行，以光大也。", "无往不复，天地际也。", "翩翩不富，皆失实也。不戒以孚，中心愿也。", "以祉元吉，中以行愿也。", "城复于隍，其命乱也。"]}, "8,1": {"index": 12, "name": "天地否", "gua_ci": "否：否之匪人，不利君子贞，大往小来。", "tai_zuan": "否之匪人，不利君子贞。大往小来，则是天地不交，而万物不通也；上下不交，而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子。小人道长，君子道消也。", "da_xiang": "天地不交，否；君子以俭德辟难，不可荣以禄。", "yao": ["拔茅茹，以其汇，贞吉亨。", "包承。小人吉，大人否亨。", "包羞。", "有命无咎，畴离祉。", "休否，大人吉。其亡其亡，系于苞桑。", "倾否，先否后喜。"], "yao_xiao_xiang": ["拔茅贞吉，志在君也。", "大人否亨，不乱群也。", "包羞，位不当也。", "有命无咎，志行也。", "大人之吉，位正当也。", "否终则倾，何可长也。"]}, "3,1": {"index": 13, "name": "天火同人", "gua_ci": "同人：同人于野，亨。利涉大川，利君子贞。", "tai_zuan": "同人，柔得位得中，而应乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。", "da_xiang": "天与火，同人；君子以类族辨物。", "yao": ["同人于门，无咎。", "同人于宗，吝。", "伏戎于莽，升其高陵，三岁不兴。", "乘其墉，弗克攻，吉。", "同人，先号啕而后笑。大师克相遇。", "同人于郊，无悔。"], "yao_xiao_xiang": ["出门同人，又谁咎也。", "同人于宗，吝道也。", "伏戎于莽，敌刚也。三岁不兴，安行也。", "乘其墉，义弗克也，其吉，则困而反则也。", "同人之先，以中直也。大师相遇，言相克也。", "同人于郊，志未得也。"]}, "1,3": {"index": 14, "name": "火天大有", "gua_ci": "大有：元亨。", "tai_zuan": "大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。", "da_xiang": "火在天上，大有；君子以竭恶扬善，顺天休命。", "yao": ["无交害，匪咎，艰则无咎。", "大车以载，有攸往，无咎。", "公用亨于天子，小人弗克。", "匪其彭，无咎。", "厥孚交如，威如；吉。", "自天佑之，吉无不利。"], "yao_xiao_xiang": ["大有初九，无交害也。", "大车以载，积中不败也。", "公用亨于天子，小人害也。", "匪其彭，无咎；明辨晰也。", "厥孚交如，信以发志也。威如之吉，易而无备也。", "大有上吉，自天佑也。"]}, "7,8": {"index": 15, "name": "地山谦", "gua_ci": "谦：亨，君子有终。", "tai_zuan": "谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。", "da_xiang": "地中有山，谦；君子以裒多益寡，称物平施。", "yao": ["谦谦君子，用涉大川，吉。", "鸣谦，贞吉。", "劳谦君子，有终吉。", "无不利，谦。", "不富，以其邻，利用侵伐，无不利。", "鸣谦，利用行师，征邑国。"], "yao_xiao_xiang": ["谦谦君子，卑以自牧也。", "鸣谦贞吉，中心得也。", "劳谦君子，万民服也。", "无不利，谦；不违则也。", "利用侵伐，征不服也。", "鸣谦，志未得也。可用行师，征邑国也。"]}, "8,4": {"index": 16, "name": "雷地豫", "gua_ci": "豫：利建侯行师。", "tai_zuan": "豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒；圣人以顺动，则刑罚清而民服。豫之时义大矣哉！", "da_xiang": "雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。", "yao": ["鸣豫，凶。", "介于石，不终日，贞吉。", "盱豫，悔。迟有悔。", "由豫，大有得。勿疑。朋盍簪。", "贞疾，恒不死。", "冥豫，成有渝，无咎。"], "yao_xiao_xiang": ["初六鸣豫，志穷凶也。", "六二贞吉，以中正也。", "六三盱豫有悔，位不当也。", "九四由豫，大有得；志大行也。", "六五贞疾，乘刚也。恒不死，中未亡也。", "上六冥豫在上，何可长也。"]}, "4,2": {"index": 17, "name": "泽雷随", "gua_ci": "随：元亨利贞，无咎。", "tai_zuan": "随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随之时义大矣哉！", "da_xiang": "泽中有雷，随；君子以向晦入宴息。", "yao": ["官有渝，贞吉。出门交有功。", "系小子，失丈夫。", "系丈夫，失小子。随有求得，利居贞。", "随有获，贞凶。有孚在道，以明，何咎。", "孚于嘉，吉。", "拘系之，乃从维之。王用亨于西山。"], "yao_xiao_xiang": ["官有渝，从正吉也。出门交有功，不失也。", "系小子，弗兼与也。", "系丈夫，志舍下也。", "随有获，其义凶也。有孚在道，明功也。", "孚于嘉，吉；位正中中也。", "拘系之，上穷也。"]}, "5,7": {"index": 18, "name": "山风蛊", "gua_ci": "蛊：元亨，利涉大川。先甲三日，后甲三日。", "tai_zuan": "蛊，刚上而柔下，巽而止，蛊。蛊，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。", "da_xiang": "山下有风，蛊；君子以振民育德。", "yao": ["干父之蛊，有子，考无咎，厉终吉。", "干母之蛊，不可贞。", "干父小有晦，无大咎。", "裕父之蛊，往见吝。", "干父之蛊，用誉。", "不事王侯，高尚其事。"], "yao_xiao_xiang": ["干父之蛊，意承考也。", "干母之蛊，得中道也。", "干父之蛊，终无咎也。", "裕父之蛊，往未得也。", "干父之蛊；承以德也。", "不事王侯，志可则也。"]}, "2,8": {"index": 19, "name": "地泽临", "gua_ci": "临：元，亨，利，贞。至于八月有凶。", "tai_zuan": "临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。", "da_xiang": "泽上有地，临；君子以教思无穷，容保民无疆。", "yao": ["咸临，贞吉。", "咸临，吉无不利。", "甘临，无攸利。既忧之，无咎。", "至临，无咎。", "知临，大君之宜，吉。", "敦临，吉无咎。"], "yao_xiao_xiang": ["咸临贞吉，志行正也。", "咸临吉无不利；未顺命也。", "甘临，位不当也。既忧之，咎不长也。", "至临无咎，位当也。", "大君之宜，行中之谓也。", "敦临之吉，志在内也。"]}, "8,5": {"index": 20, "name": "风地观", "gua_ci": "观：盥而不荐，有孚颙若。", "tai_zuan": "大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。", "da_xiang": "风行地上，观；先王以省方，观民设教。", "yao": ["童观，小人无咎，君子吝。", "窥观，利女贞。", "观我生，进退。", "观国之光，利用宾于王。", "观我生，君子无咎。", "观其生，君子无咎。"], "yao_xiao_xiang": ["初六童观，小人道也。", "六二窥观女贞，亦可丑也。", "六三观我生，进退；未失道也。", "六四观国之光，尚宾也。", "九五观民也。", "上九观其生，志未平也。"]}, "4,3": {"index": 21, "name": "火雷噬嗑", "gua_ci": "噬嗑：亨。利用狱。", "tai_zuan": "颐中有物，曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。", "da_xiang": "雷电噬嗑；先王以明罚敕法。", "yao": ["履校灭趾，无咎。", "噬肤灭鼻，无咎。", "噬腊肉，遇毒；小吝，无咎。", "噬乾胏，得金矢，利艰贞，吉。", "噬乾肉，得黄金，贞厉，无咎。", "何校灭耳，凶。"], "yao_xiao_xiang": ["履校灭趾，不行也。", "噬肤灭鼻，乘刚也。", "遇毒，位不当也。", "利艰贞吉，未光也。", "贞厉无咎，得当也。", "何校灭耳，聪不明也。"]}, "3,7": {"index": 22, "name": "山火贲", "gua_ci": "贲：亨。小利有所往。", "tai_zuan": "贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。", "da_xiang": "山下有火，贲；君子以明庶政，无敢折狱。", "yao": ["贲其趾，舍车而徒。", "贲其须。", "贲如濡如，永贞吉。", "贲如皤如，白马翰如，匪寇婚媾。", "贲于丘园，束帛戋戋，吝，终吉。", "白贲，无咎。"], "yao_xiao_xiang": ["舍车而徒，义弗乘也。", "贲其须，与上兴也。", "永贞之吉，终莫之陵也。", "六四，当位疑也。匪寇婚媾，终无尤也。", "六五之吉，有喜也。", "白贲无咎，上得志也。"]}, "8,7": {"index": 23, "name": "山地剥", "gua_ci": "剥：不利有攸往。", "tai_zuan": "剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。", "da_xiang": "山附地上，剥；上以厚下，安宅。", "yao": ["剥床以足，蔑贞凶。", "剥床以辨，蔑贞凶。", "剥之，无咎。", "剥床以肤，凶。", "贯鱼，以宫人宠，无不利。", "硕果不食，君子得舆，小人剥庐。"], "yao_xiao_xiang": ["剥床以足，以灭下也。", "剥床以辨，未有与也。", "剥之无咎，失上下也。", "剥床以肤，切近灾也。", "以宫人宠，终无尤也。", "君子得舆，民所载也。小人剥庐，终不可用也。"]}, "4,8": {"index": 24, "name": "地雷复", "gua_ci": "复：亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。", "tai_zuan": "复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？", "da_xiang": "雷在地中，复；先王以至日闭关，商旅不行，后不省方。", "yao": ["不复远，无祇悔，元吉。", "休复，吉。", "频复，厉无咎。", "中行独复。", "敦复，无悔。", "迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。"], "yao_xiao_xiang": ["不远之复，以修身也。", "休复之吉，以下仁也。", "频复之厉，义无咎也。", "中行独复，以从道也。", "敦复无悔，中以自考也。", "迷复之凶，反君道也。"]}, "4,1": {"index": 25, "name": "天雷无妄", "gua_ci": "无妄：元，亨，利，贞。其匪正有眚，不利有攸往。", "tai_zuan": "无妄，刚自外来，而为主於内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？天命不佑，行矣哉？", "da_xiang": "天下雷行，物与无妄；先王以茂对时，育万物。", "yao": ["无妄，往吉。", "不耕获，不菑畲，则利有攸往。", "无妄之灾，或系之牛，行人之得，邑人之灾。", "可贞，无咎。", "无妄之疾，勿药有喜。", "无妄，行有眚，无攸利。"], "yao_xiao_xiang": ["无妄之往，得志也。", "不耕获，未富也。", "行人得牛，邑人灾也。", "可贞无咎，固有之也。", "无妄之药，不可试也。", "无妄之行，穷之灾也。"]}, "1,7": {"index": 26, "name": "山天大畜", "gua_ci": "大畜：利贞，不家食吉，利涉大川。", "tai_zuan": "大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。", "da_xiang": "天在山中，大畜；君子以多识前言往行，以畜其德。", "yao": ["有厉利已。", "舆说辐。", "良马逐，利艰贞。曰闲舆卫，利有攸往。", "童豕之牿，元吉。", "豶豕之牙，吉。", "何天之衢，亨。"], "yao_xiao_xiang": ["有厉利已，不犯灾也。", "舆说辐，中无尤也。", "利有攸往，上合志也。", "六四元吉，有喜也。", "六五之吉，有庆也。", "何天之衢，道大行也。"]}, "4,7": {"index": 27, "name": "山雷颐", "gua_ci": "颐：贞吉。观颐，自求口实。", "tai_zuan": "颐贞吉，养正则吉也。观颐，观其所养也；自求口实，观其自养也。天地养万物，圣人养贤，以及万民；颐之时义大矣哉！", "da_xiang": "山下有雷，颐；君子以慎言语，节饮食。", "yao": ["舍尔灵龟，观我朵颐，凶。", "颠颐，拂经，于丘颐，征凶。", "拂颐，贞凶，十年勿用，无攸利。", "颠颐吉，虎视眈眈，其欲逐逐，无咎。", "拂经，居贞吉，不可涉大川。", "由颐，厉吉，利涉大川。"], "yao_xiao_xiang": ["观我朵颐，亦不足贵也。", "六二征凶，行失类也。", "十年勿用，道大悖也。", "颠颐之吉，上施光也。", "居贞之吉，顺以从上也。", "由颐厉吉，大有庆也。"]}, "5,2": {"index": 28, "name": "泽风大过", "gua_ci": "大过：栋桡，利有攸往，亨。", "tai_zuan": "大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时义大矣哉！", "da_xiang": "泽灭木，大过；君子以独立不惧，遁世无闷。", "yao": ["藉用白茅，无咎。", "枯杨生稊，老夫得其女妻，无不利。", "栋桡，凶。", "栋隆，吉；有它吝。", "枯杨生华，老妇得士夫，无咎无誉。", "过涉灭顶，凶，无咎。"], "yao_xiao_xiang": ["藉用白茅，柔在下也。", "老夫女妻，过以相与也。", "栋桡之凶，不可以有辅也。", "栋隆之吉，不桡乎下也。", "枯杨生华，何可久也。老妇士夫，亦可丑也。", "过涉之凶，不可咎也。"]}, "6,6": {"index": 29, "name": "坎为水", "gua_ci": "坎：习坎，有孚，维心亨，行有尚。", "tai_zuan": "习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，坎之时用大矣哉！", "da_xiang": "水洊至，习坎；君子以常德行，习教事。", "yao": ["习坎，入于坎窞，凶。", "坎有险，求小得。", "来之坎坎，险且枕，入于坎窞，勿用。", "樽酒簋贰，用缶，纳约自牖，终无咎。", "坎不盈，祇既平，无咎。", "徽繹，置于丛棘，三岁不得，凶。"], "yao_xiao_xiang": ["习坎入坎，失道凶也。", "求小得，未出中也。", "来之坎坎，终无功也。", "樽酒簋贰，刚柔际也。", "坎不盈，中未大也。", "上六失道，凶三岁也。"]}, "3,3": {"index": 30, "name": "离为火", "gua_ci": "离：利贞，亨。畜牝牛，吉。", "tai_zuan": "离，丽也；日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下。柔丽乎中正，故亨；是以畜牝牛吉也。", "da_xiang": "明两作离，大人以继明照于四方。", "yao": ["履错然，敬之无咎。", "黄离，元吉。", "日昃之离，不鼓缶而歌，则大耋之嗟，凶。", "突如其来如，焚如，死如，弃如。", "出涕沱若，戚嗟若，吉。", "王用出征，有嘉折首，获其匪丑，无咎。"], "yao_xiao_xiang": ["履错之敬，以辟咎也。", "黄离元吉，得中道也。", "日昃之离，何可久也。", "突如其来如，无所容也。", "六五之吉，离王公也。", "王用出征，以正邦也。"]}, "7,2": {"index": 31, "name": "泽山咸", "gua_ci": "咸：亨，利贞，取女吉。", "tai_zuan": "咸，感也。柔上而刚下，二气感应以相与，止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平；观其所感，而天地万物之情可见矣！", "da_xiang": "山上有泽，咸；君子以虚受人。", "yao": ["咸其拇。", "咸其腓，凶，居吉。", "咸其股，执其随，往吝。", "贞吉悔亡，憧憧往来，朋从尔思。", "咸其脢，无悔。", "咸其辅，颊，舌。"], "yao_xiao_xiang": ["咸其拇，志在外也。", "虽凶，居吉，顺不害也。", "咸其股，亦不处也。志在随人，所执下也。", "贞吉悔亡，未感害也。憧憧往来，未光大也。", "咸其脢，志末也。", "咸其辅，颊，舌，滕口说也。"]}, "5,4": {"index": 32, "name": "雷风恒", "gua_ci": "恒：亨，无咎，利贞，利有攸往。", "tai_zuan": "恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞；久於其道也，天地之道，恒久而不已也。利有攸往，终则有始也。日月得天，而能久照，四时变化，而能久成，圣人久於其道，而天下化成；观其所恒，而天地万物之情可见矣！", "da_xiang": "雷风，恒；君子以立不易方。", "yao": ["浚恒，贞凶，无攸利。", "悔亡。", "不恒其德，或承之羞，贞吝。", "田无禽。", "恒其德，贞，妇人吉，夫子凶。", "振恒，凶。"], "yao_xiao_xiang": ["浚恒之凶，始求深也。", "九二悔亡，能久中也。", "不恒其德，无所容也。", "久非其位，安得禽也。", "妇人贞吉，从一而终也。夫子制义，从妇凶也。", "振恒在上，大无功也。"]}, "7,1": {"index": 33, "name": "天山遁", "gua_ci": "遁：亨，小利贞。", "tai_zuan": "遁亨，遁而亨也。刚当位而应，与时行也。小利贞，浸而长也。遁之时义大矣哉！", "da_xiang": "天下有山，遁；君子以远小人，不恶而严。", "yao": ["遁尾，厉，勿用有攸往。", "执之用黄牛之革，莫之胜说。", "系遁，有疾厉，畜臣妾吉。", "好遁君子吉，小人否。", "嘉遁，贞吉。", "肥遁，无不利。"], "yao_xiao_xiang": ["遁尾之厉，不往何灾也。", "执用黄牛，固志也。", "系遁之厉，有疾惫也。畜臣妾吉，不可大事也。", "君子好遁，小人否也。", "嘉遁贞吉，以正志也。", "肥遁，无不利；无所疑也。"]}, "1,4": {"index": 34, "name": "雷天大壮", "gua_ci": "大壮：利贞。", "tai_zuan": "大壮，大者壮也。刚以动，故壮。大壮利贞；大者正也。正大而天地之情可见矣！", "da_xiang": "雷在天上，大壮；君子以非礼勿履。", "yao": ["壮于趾，征凶，有孚。", "贞吉。", "小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。", "贞吉悔亡，藩决不羸，壮于大舆之輹。", "丧羊于易，无悔。", "羝羊触藩，不能退，不能遂，无攸利，艰则吉。"], "yao_xiao_xiang": ["壮于趾，其孚穷也。", "九二贞吉，以中也。", "小人用壮，君子罔也。", "藩决不羸，尚往也。", "丧羊于易，位不当也。", "不能退，不能遂，不祥也。艰则吉，咎不长也。"]}, "8,3": {"index": 35, "name": "火地晋", "gua_ci": "晋：康侯用锡马蕃庶，昼日三接。", "tai_zuan": "晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日三接也。", "da_xiang": "明出地上，晋；君子以自昭明德。", "yao": ["晋如，摧如，贞吉。罔孚，裕无咎。", "晋如，愁如，贞吉。受兹介福，于其王母。", "众允，悔亡。", "晋如硕鼠，贞厉。", "悔亡，失得勿恤，往吉无不利。", "晋其角，维用伐邑，厉吉无咎，贞吝。"], "yao_xiao_xiang": ["晋如，摧如；独行正也。裕无咎；未受命也。", "受之介福，以中正也。", "众允之，志上行也。", "硕鼠贞厉，位不当也。", "失得勿恤，往有庆也。", "维用伐邑，道未光也。"]}, "3,8": {"index": 36, "name": "地火明夷", "gua_ci": "明夷：利艰贞。", "tai_zuan": "明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也，内难而能正其志，箕子以之。", "da_xiang": "明入地中，明夷；君子以莅众，用晦而明。", "yao": ["明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。", "明夷，夷于左股，用拯马壮，吉。", "明夷于南狩，得其大首，不可疾贞。", "入于左腹，获明夷之心，出于门庭。", "箕子之明夷，利贞。", "不明晦，初登于天，后入于地。"], "yao_xiao_xiang": ["君子于行，义不食也。", "六二之吉，顺以则也。", "南狩之志，乃大得也。", "入于左腹，获心意也。", "箕子之贞，明不可息也。", "初登于天，照四国也。后入于地，失则也。"]}, "3,5": {"index": 37, "name": "风火家人", "gua_ci": "家人：利女贞。", "tai_zuan": "家人，女正位乎内，男正位乎外，男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正；正家而天下定矣。", "da_xiang": "风自火出，家人；君子以言有物，而行有恒。", "yao": ["闲有家，悔亡。", "无攸遂，在中馈，贞吉。", "家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。", "富家，大吉。", "王假有家，勿恤吉。", "有孚威如，终吉。"], "yao_xiao_xiang": ["闲有家，志未变也。", "六二之吉，顺以巽也。", "家人嗃嗃，未失也；妇子嘻嘻，失家节也。", "富家大吉，顺在位也。", "王假有家，交相爱也。", "威如之吉，反身之谓也。"]}, "2,3": {"index": 38, "name": "火泽睽", "gua_ci": "睽：小事吉。", "tai_zuan": "睽，火动而上，泽动而下；二女同居，其志不同行；说而丽乎明，柔进而上行，得中而应乎刚；是以小事吉。天地睽，而其事同也；男女睽，而其志通也；万物睽，而其事类也；睽之时用大矣哉！", "da_xiang": "上火下泽，睽；君子以同而异。", "yao": ["悔亡，丧马勿逐，自复；见恶人无咎。", "遇主于巷，无咎。", "见舆曳，其牛掣，其人天且劓，无初有终。", "睽孤，遇元夫，交孚，厉无咎。", "悔亡，厥宗噬肤，往何咎。", "睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。"], "yao_xiao_xiang": ["见恶人，以辟咎也。", "遇主于巷，未失道也。", "见舆曳，位不当也。无初有终，遇刚也。", "交孚无咎，志行也。", "厥宗噬肤，往有庆也。", "遇雨之吉，群疑亡也。"]}, "7,6": {"index": 39, "name": "水山蹇", "gua_ci": "蹇：利西南，不利东北；利见大人，贞吉。", "tai_zuan": "蹇，难也，险在前也。见险而能止，知矣哉！蹇利西南，往得中也；不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！", "da_xiang": "山上有水，蹇；君子以反身修德。", "yao": ["往蹇，来誉。", "王臣蹇蹇，匪躬之故。", "往蹇来反。", "往蹇来连。", "大蹇朋来。", "往蹇来硕，吉；利见大人。"], "yao_xiao_xiang": ["往蹇来誉，宜待也。", "王臣蹇蹇，终无尤也。", "往蹇来反，内喜之也。", "往蹇来连，当位实也。", "大蹇朋来，以中节也。", "往蹇来硕，志在内也。利见大人，以从贵也。"]}, "6,4": {"index": 40, "name": "雷水解", "gua_ci": "解：利西南，无所往，其来复吉。有攸往，夙吉。", "tai_zuan": "解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之时义大矣哉！", "da_xiang": "雷雨作，解；君子以赦过宥罪。", "yao": ["无咎。", "田获三狐，得黄矢，贞吉。", "负且乘，致寇至，贞吝。", "解而拇，朋至斯孚。", "君子维有解，吉；有孚于小人。", "公用射隼，于高墉之上，获之，无不利。"], "yao_xiao_xiang": ["刚柔之际，义无咎也。", "九二贞吉，得中道也。", "负且乘，亦可丑也，自我致戎，又谁咎也。", "解而拇，未当位也。", "君子有解，小人退也。", "公用射隼，以解悖也。"]}, "2,7": {"index": 41, "name": "山泽损", "gua_ci": "损：有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。", "tai_zuan": "损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享；二簋应有时。损刚益柔有时，损益盈虚，与时偕行。", "da_xiang": "山下有泽，损；君子以惩忿窒欲。", "yao": ["已事遄往，无咎，酌损之。", "利贞，征凶，弗损益之。", "三人行，则损一人；一人行，则得其友。", "损其疾，使遄有喜，无咎。", "或益之，十朋之龟弗克违，元吉。", "弗损益之，无咎，贞吉，利有攸往，得臣无家。"], "yao_xiao_xiang": ["已事遄往，尚合志也。", "九二利贞，中以为志也。", "一人行，三则疑也。", "损其疾，亦可喜也。", "六五元吉，自上佑也。", "弗损益之，大得志也。"]}, "4,5": {"index": 42, "name": "风雷益", "gua_ci": "益：利有攸往，利涉大川。", "tai_zuan": "益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。", "da_xiang": "风雷，益；君子以见善则迁，有过则改。", "yao": ["利用为大作，元吉，无咎。", "或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。", "益之用凶事，无咎。有孚中行，告公用圭。", "中行，告公从。利用为依迁国。", "有孚惠心，勿问元吉。有孚惠我德。", "莫益之，或击之，立心勿恒，凶。"], "yao_xiao_xiang": ["元吉无咎，下不厚事也。", "或益之，自外来也。", "益用凶事，固有之也。", "告公从，以益志也。", "有孚惠心，勿问之矣。惠我德，大得志也。", "莫益之，偏辞也。或击之，自外来也。"]}, "1,2": {"index": 43, "name": "泽天夬", "gua_ci": "夬：扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。", "tai_zuan": "夬，决也，刚决柔也。健而说，决而和，扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。", "da_xiang": "泽上于天，夬；君子以施禄及下，居德则忌。", "yao": ["壮于前趾，往不胜为吝。", "惕号，莫夜有戎，勿恤。", "壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。", "臀无肤，其行次且。牵羊悔亡，闻言不信。", "苋陆夬夬，中行无咎。", "无号，终有凶。"], "yao_xiao_xiang": ["不胜而往，咎也。", "莫夜有戎，得中道也。", "君子夬夬，终无咎也。", "其行次且，位不当也。闻言不信，聪不明也。", "中行无咎，中未光也。", "无号之凶，终不可长也。"]}, "5,1": {"index": 44, "name": "天风姤", "gua_ci": "姤：女壮，勿用取女。", "tai_zuan": "姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！", "da_xiang": "天下有风，姤；后以施命诰四方。", "yao": ["系于金柅，贞吉，有攸往，见凶，羸豕踟躅。", "包有鱼，无咎，不利宾。", "臀无肤，其行次且，厉，无大咎。", "包无鱼，起凶。", "以杞包瓜，含章，有陨自天。", "姤其角，吝，无咎。"], "yao_xiao_xiang": ["系于金柅，柔道牵也。", "包有鱼，义不及宾也。", "其行次且，行未牵也。", "无鱼之凶，远民也。", "九五含章，中正也。有陨自天，志不舍命也。", "姤其角，上穷吝也。"]}, "8,2": {"index": 45, "name": "泽地萃", "gua_ci": "萃：亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。", "tai_zuan": "萃，聚也。顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人，亨聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣！", "da_xiang": "泽上于地，萃；君子以除戎器，戒不虞。", "yao": ["有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。", "引吉，无咎，孚乃利用禴。", "萃如，嗟如，无攸利，往无咎，小吝。", "大吉，无咎。", "萃有位，无咎。匪孚，元永贞，悔亡。", "赍咨涕洟，无咎。"], "yao_xiao_xiang": ["一握为笑，位不当也。", "引吉无咎，中未变也。", "往无咎，上巽也。", "大吉无咎，位不当也。", "萃有位，志未平也。", "赍咨涕洟，未安上也。"]}, "5,8": {"index": 46, "name": "地风升", "gua_ci": "升：元亨，用见大人，勿恤，南征吉。", "tai_zuan": "柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉，志行也。", "da_xiang": "地中生木，升；君子以顺德，积小以高大。", "yao": ["允升，大吉。", "孚乃利用禴，无咎。", "升虚邑。", "王用亨于岐山，吉无咎。", "贞吉，升阶。", "冥升，利于不息之贞。"], "yao_xiao_xiang": ["允升大吉，上合志也。", "九二之孚，有喜也。", "升虚邑，无所疑也。", "王用亨于岐山，顺事也。", "贞吉升阶，中正也。", "冥升在上，消不富也。"]}, "6,2": {"index": 47, "name": "泽水困", "gua_ci": "困：亨，贞，大人吉，无咎，有言不信。", "tai_zuan": "困，刚掩也。险以说，困而不失其所，亨；其为君子乎？贞大人吉，以刚中也。有言不信，尚口乃穷也。", "da_xiang": "泽中有水，困；君子以致命遂志。", "yao": ["臀困于株木，入于幽谷，三岁不见。", "困于酒食，朱绂方来，利用亨祀，征凶，无咎。", "困于石，据于蒺藜，入于其宫，不见其妻，凶。", "来徐徐，困于金车，吝，有终。", "劓刖，困于赤绂，乃徐有说，利用祭祀。", "困于葛藟，于臲卼，曰动悔。有悔，征吉。"], "yao_xiao_xiang": ["入于幽谷，幽不明也。", "困于酒食，中有庆也。", "据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。", "来徐徐，志在下也。虽不当位，有与也。", "劓刖，志未得也。乃徐有说，以中节也。", "困于葛藟，未当也。动悔有悔，吉行也。"]}, "5,6": {"index": 48, "name": "水风井", "gua_ci": "井：改邑不改井，无丧无得，往来井井。汔至，亦未繘井，羸其瓶，凶。", "tai_zuan": "巽乎水而上水，井；井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。", "da_xiang": "木上有水，井；君子以劳民劝相。", "yao": ["井泥不食，旧井无禽。", "井谷射鲋，瓮敝漏。", "井渫不食，为我民恻，可用汲，王明，并受其福。", "井甃，无咎。", "井冽，寒泉食。", "井收勿幕，有孚无吉。"], "yao_xiao_xiang": ["旧井无禽，时舍也。", "井谷射鲋，无与也。", "井渫不食，行恻也。求王明，受福也。", "井甃无咎，修井也。", "寒泉之食，中正也。", "元吉在上大成也。"]}, "3,2": {"index": 49, "name": "泽火革", "gua_ci": "革：己日乃孚，元亨利贞，悔亡。", "tai_zuan": "革，水火相息，二女同居，其志不相得，曰革。己日乃孚，革而信之。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人，革之时义大矣哉！", "da_xiang": "泽中有火，革；君子以治历明时。", "yao": ["巩用黄牛之革。", "己日乃革之，征吉，无咎。", "征凶，贞厉，革言三就，有孚。", "悔亡，有孚改命，吉。", "大人虎变，未占有孚。", "君子豹变，小人革面，征凶，居贞吉。"], "yao_xiao_xiang": ["巩用黄牛，不可以有为也。", "己日革之，行有嘉也。", "革言三就，又何之矣。", "改命之吉，信志也。", "大人虎变，其文炳也。", "君子豹变，其文蔚也。小人革面，顺以从君也。"]}, "5,3": {"index": 50, "name": "火风鼎", "gua_ci": "鼎：元吉，亨。", "tai_zuan": "鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。", "da_xiang": "木上有火，鼎；君子以正位凝命。", "yao": ["鼎颠趾，利出否，得妾以其子，无咎。", "鼎有实，我仇有疾，不我能即，吉。", "鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。", "鼎折足，覆公餗，其形渥，凶。", "鼎黄耳金铉，利贞。", "鼎玉铉，大吉，无不利。"], "yao_xiao_xiang": ["鼎颠趾，未悖也。", "鼎有实，慎所之也。", "鼎耳革，亦可患也。", "覆公餗，信如何也。", "鼎黄耳，中以为实也。", "玉铉在上，刚柔节也。"]}, "4,4": {"index": 51, "name": "震为雷", "gua_ci": "震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。", "tai_zuan": "震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。", "da_xiang": "洊雷，震；君子以恐惧修身。", "yao": ["震来虩虩，后笑言哑哑，吉。", "震来厉，亿丧贝，跻于九陵，勿逐，七日得。", "震苏苏，震行无眚。", "震遂泥。", "震往来厉，亿无丧，有事。", "震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。"], "yao_xiao_xiang": ["震来虩虩，恐致福也。笑言哑哑，后有则也。", "震来厉，乘刚也。", "震苏苏，位不当也。", "震遂泥，未光也。", "震往来厉，危行也。其事在中，大无丧也。", "震索索，中未得也。虽凶无咎，畏邻戒也。"]}, "7,7": {"index": 52, "name": "艮为山", "gua_ci": "艮：艮其背，不获其身，行其庭，不见其人，无咎。", "tai_zuan": "艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。", "da_xiang": "兼山，艮；君子以思不出其位。", "yao": ["艮其趾，无咎，利永贞。", "艮其腓，不拯其随，其心不快。", "艮其限，列其夤，厉薰心。", "艮其身，无咎。", "艮其辅，言有序，悔亡。", "敦艮，吉。"], "yao_xiao_xiang": ["艮其趾，未失正也。", "不拯其随，未退听也。", "艮其限，危薰心也。", "艮其身，止诸躬也。", "艮其辅，以中正也。", "敦艮之吉，以厚终也。"]}, "7,5": {"index": 53, "name": "风山渐", "gua_ci": "渐：女归吉，利贞。", "tai_zuan": "渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚得中也。止而巽，动不穷也。", "da_xiang": "山上有木，渐；君子以居贤德善俗。", "yao": ["鸿渐于干，小子厉，有言，无咎。", "鸿渐于磐，饮食衠衠，吉。", "鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。", "鸿渐于木，或得其桷，无咎。", "鸿渐于陵，妇三岁不孕，终莫之胜，吉。", "鸿渐于逵，其羽可用为仪，吉。"], "yao_xiao_xiang": ["小子之厉，义无咎也。", "饮食衠衠，不素饱也。", "夫征不复，离群丑也。妇孕不育，失其道也。", "或得其桷，顺以巽也。", "终莫之胜，吉；得所愿也。", "其羽可用为仪，不可乱也。"]}, "2,4": {"index": 54, "name": "雷泽归妹", "gua_ci": "归妹：征凶，无攸利。", "tai_zuan": "归妹，天地之大义也。天地不交，而万物不兴，归妹人之终也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。", "da_xiang": "泽上有雷，归妹；君子以永终知敝。", "yao": ["归妹以娣，跛能履，征吉。", "眇能视，利幽人之贞。", "归妹以须，反归以娣。", "归妹愆期，迟归有时。", "帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。", "女承筐无实，士刲羊无血，无攸利。"], "yao_xiao_xiang": ["归妹以娣，以恒也。跛能履吉，相承也。", "利幽人之贞，未变常也。", "归妹以须，未当也。", "愆期之志，有待而行也。", "帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。", "上六无实，承虚筐也。"]}, "3,4": {"index": 55, "name": "雷火丰", "gua_ci": "丰：亨，王假之，勿忧，宜日中。", "tai_zuan": "丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况人于人，况鬼神乎？", "da_xiang": "雷电皆至，丰；君子以折狱致刑。", "yao": ["遇其配主，虽旬无咎，往有尚。", "丰其蔀，日中见斗，往得疑疾，有孚发若，吉。", "丰其沛，日中见昧，折其右肱，无咎。", "丰其蔀，日中见斗，遇其夷主，吉。", "来章，有庆誉，吉。", "丰其屋，蔀其家，窥其户，阒其无人，三岁不见，凶。"], "yao_xiao_xiang": ["遇其配主，往有尚也。", "丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，未定也。", "丰其沛，亦不可过也。", "来章，有庆誉也。", "丰其屋，天际翔也。窥其户，阒其无人，自藏也。"]}, "7,3": {"index": 56, "name": "火山旅", "gua_ci": "旅：小亨，旅贞吉。", "tai_zuan": "旅，小亨，柔得中乎外，而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！", "da_xiang": "山上有火，旅；君子以明慎用刑，而不留狱。", "yao": ["旅琐琐，斯其所取灾。", "旅即次，怀其资，得童仆贞。", "旅焚其次，丧其童仆，贞厉。", "旅于处，得其资斧，我心不快。", "射雉一矢亡，终以誉命。", "鸟焚其巢，旅人先笑后号啕。丧牛于易，凶。"], "yao_xiao_xiang": ["旅琐琐，志穷灾也。", "得童仆贞，终无尤也。", "旅焚其次，亦以伤矣。以旅与下，其义丧也。", "旅于处，未得位也。得其资斧，心未快也。", "终以誉命，上逮也。", "以旅而在，其义焚也。丧牛于易，终莫之闻也。"]}, "5,5": {"index": 57, "name": "巽为风", "gua_ci": "巽：小亨，利攸往，利见大人。", "tai_zuan": "巽，柔皆顺乎刚，是以小亨，利有攸往，利见大人。", "da_xiang": "随风，巽；君子以申命行事。", "yao": ["进退，利武人之贞。", "巽在床下。用史巫纷若，吉无咎。", "频巽，吝。", "悔亡，田获三品。", "贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。", "巽在床下，丧其资斧，贞凶。"], "yao_xiao_xiang": ["进退，志疑也。利武人之贞，志治也。", "纷若之吉，得中也。", "频巽之吝，志穷也。", "田获三品，有功也。", "九五之吉，位正中也。", "上六巽在床下，上穷也。丧其资斧，正乎凶也。"]}, "2,2": {"index": 58, "name": "兑为泽", "gua_ci": "兑：亨，利贞。", "tai_zuan": "兑，说也。刚中而柔外，说以利贞，是以顺乎天，而应乎人。说以先民，民忘其劳；说以犯难，民忘其死；说之大，民劝矣哉！", "da_xiang": "丽泽，兑；君子以朋友讲习。", "yao": ["和兑，吉。", "孚兑，吉，悔亡。", "来兑，凶。", "商兑，未宁，介疾有喜。", "孚于剥，有厉。", "引兑。"], "yao_xiao_xiang": ["和兑之吉，行未疑也。", "孚兑之吉，信志也。", "来兑之凶，位不当也。", "九四之喜，有庆也。", "孚于剥，危偏辞也。", "上六引兑，未光也。"]}, "6,5": {"index": 59, "name": "风水涣", "gua_ci": "涣：亨。王假有庙，利涉大川，利贞。", "tai_zuan": "涣，亨。刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。", "da_xiang": "风行水上，涣；先王以享于帝立庙。", "yao": ["用拯马壮，吉。", "涣奔其机，悔亡。", "涣其躬，无悔。", "涣其群，元吉。涣有丘，匪夷所思。", "涣汗其大号，涣王居，无咎。", "涣其血，去逖出，无咎。"], "yao_xiao_xiang": ["用拯马壮吉，中未变也。", "涣奔其机，得愿也。", "涣其躬，志在外也。", "涣其群元吉，光大也。", "王居无咎，正位也。", "涣其血，远害也。"]}, "2,6": {"index": 60, "name": "水泽节", "gua_ci": "节：亨。苦节不可贞。", "tai_zuan": "节，亨，刚柔分，而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。", "da_xiang": "泽上有水，节；君子以制数度，议德行。", "yao": ["不出户庭，无咎。", "不出门庭，凶。", "不节若，则嗟若，无咎。", "安节，亨。", "甘节，吉；往有尚。", "苦节，贞凶，悔亡。"], "yao_xiao_xiang": ["不出户庭，知通塞也。", "不出门庭凶，失时极也。", "不节之嗟，又谁咎也。", "安节之亨，承上道也。", "甘节之吉，居位中也。", "苦节贞凶，其道穷也。"]}, "2,5": {"index": 61, "name": "风泽中孚", "gua_ci": "中孚：豚鱼吉，利涉大川，利贞。", "tai_zuan": "中孚，柔在内而刚得中，说而巽，孚，乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。", "da_xiang": "泽上有风，中孚；君子以议狱缓死。", "yao": ["虞吉，有他不燕。", "鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。", "得敌，或鼓或罢，或泣或歌。", "月几望，马匹亡，无咎。", "有孚挛如，无咎。", "翰音登于天，贞凶。"], "yao_xiao_xiang": ["虞吉，志未变也。", "其子和之，亦不便也。", "得敌，或鼓或罢，位不当也。", "马匹亡，绝类上也。", "有孚挛如，位正当也。", "翰音登于天，何可长也。"]}, "7,4": {"index": 62, "name": "雷山小过", "gua_ci": "小过：亨，利贞，可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。", "tai_zuan": "小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也。", "da_xiang": "山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。", "yao": ["飞鸟以凶。", "过其祖，遇其妣；不及其君，遇其臣；无咎。", "弗过防之，从或戕之，凶。", "无咎，弗过遇之。往厉必戒，勿用永贞。", "密云不雨，自我西郊，公弋取彼在穴。", "弗遇过之，飞鸟离之，凶，是谓灾眚。"], "yao_xiao_xiang": ["飞鸟以凶，不可如何也。", "不及其君，臣不过也。", "从或戕之，凶如何也。", "弗过遇之，位不当也。往厉必戒，终不可长也。", "密云不雨，已上也。", "弗遇过之，已亢也。"]}, "3,6": {"index": 63, "name": "水火既济", "gua_ci": "既济：亨，小利贞，初吉终乱。", "tai_zuan": "既济，亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。", "da_xiang": "水在火上，既济；君子以思患而豫防之。", "yao": ["曳其轮，濡其尾，无咎。", "妇丧其茀，勿逐，七日得。", "高宗伐鬼方，三年克之，小人勿用。", "繻有衣袽，终日戒。", "东邻杀牛，不如西邻之禴祭，实受其福。", "濡其首，厉。"], "yao_xiao_xiang": ["曳其轮，义无咎也。", "七日得，以中道也。", "三年克之，惫也。", "终日戒，有所疑也。", "东邻杀牛，不如西邻之时也。", "濡其首厉，何可久也。"]}, "6,3": {"index": 64, "name": "火水未济", "gua_ci": "未济：亨，小狐汔济，濡其尾，无攸利。", "tai_zuan": "未济，亨，柔得中也。小狐汔济，未出中也。濡其尾，无攸利，不续终也。虽不当位，刚柔应也。", "da_xiang": "火在水上，未济；君子以慎辨物居方。", "yao": ["濡其尾，吝。", "曳其轮，贞吉。", "未济，征凶，利涉大川。", "贞吉悔亡，震用伐鬼方，三年有赏于大国。", "贞吉，无悔，君子之光，有孚，吉。", "有孚于饮酒，无咎，濡其首，有孚失是。"], "yao_xiao_xiang": ["濡其尾，亦不知极也。", "九二贞吉，中以行正也。", "未济征凶，位不当也。", "贞吉悔亡，志行也。", "君子之光，其晖吉也。", "饮酒濡首，亦不知节也。"]}};
    </script>
    <script>
    let currentMode = 3;
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('mode3').className = mode === 3 ? 'active' : '';
        document.getElementById('modeDirect').className = mode === 0 ? 'active' : '';
        document.getElementById('input3').style.display = mode === 3 ? 'block' : 'none';
        document.getElementById('inputDirect').className = mode === 0 ? 'show' : '';
    }
    function initSelects() {
        let inner = document.getElementById('inner'), outer = document.getElementById('outer'), yao = document.getElementById('yao');
        TRIGRAMS.forEach(t => {
            inner.innerHTML += '<option value="'+t.num+'">'+t.num+' - '+t.name+' '+t.symbol+'</option>';
            outer.innerHTML += '<option value="'+t.num+'">'+t.num+' - '+t.name+' '+t.symbol+'</option>';
        });
        yao.innerHTML = '<option value="0">卦辞</option>';
        YAO_NAMES.forEach((y, i) => yao.innerHTML += '<option value="'+(i+1)+'">'+y+'</option>');
    }
    function convert(num, div) { let r = num % div; return r === 0 ? div : r; }
    function getHexData(inner, outer, yao) {
        let key = inner+','+outer, data = HEXAGRAMS[key];
        if (!data) return null;
        let result = { index: data.index, name: data.name, inner: TRIGRAMS[inner-1], outer: TRIGRAMS[outer-1] };
        if (yao === 0) {
            result.type = '卦辞'; result.content = data.gua_ci;
            result.tai_zuan = data.tai_zuan || ''; result.da_xiang = data.da_xiang || '';
        } else {
            result.type = '爻辞'; result.yao_name = YAO_NAMES[yao-1];
            result.content = data.yao[yao-1] || '';
            result.yao_xiao_xiang = data.yao_xiao_xiang ? data.yao_xiao_xiang[yao-1] : '';
        }
        return result;
    }
    function showResult(r, nums) {
        let html = '<div class="hex-name">第'+r.index+'卦 '+r.name+'</div>';
        html += '<div class="hex-info">内卦: '+r.inner.name+r.inner.symbol+' | 外卦: '+r.outer.name+r.outer.symbol+'</div>';
        if (r.type === '卦辞') {
            html += '<div class="section"><div class="section-title">卦辞</div><div class="section-content">'+r.content+'</div></div>';
            if (r.tai_zuan) html += '<div class="section"><div class="section-title">彖传</div><div class="section-content">'+r.tai_zuan+'</div></div>';
            if (r.da_xiang) html += '<div class="section"><div class="section-title">大象传</div><div class="section-content">'+r.da_xiang+'</div></div>';
        } else {
            html += '<div class="section"><div class="section-title">'+r.yao_name+'</div><div class="section-content">'+r.content+'</div></div>';
            if (r.yao_xiao_xiang) html += '<div class="section"><div class="section-title">小象传</div><div class="section-content">'+r.yao_xiao_xiang+'</div></div>';
        }
        if (nums) html += '<div class="calc-peace">'+nums[0]+'÷8='+r.inner.num+' · '+nums[1]+'÷8='+r.outer.num+' · '+nums[2]+'÷6='+(r.type==='卦辞'?0:YAO_NAMES.indexOf(r.yao_name)+1 || 6)+'</div>';
        document.getElementById('result').innerHTML = html;
        document.getElementById('result').className = 'result show';
        addHistory(r, nums);
    }
    function query3() {
        let n1 = parseInt(document.getElementById('num1').value), n2 = parseInt(document.getElementById('num2').value), n3 = parseInt(document.getElementById('num3').value);
        if (!n1 || !n2 || !n3) { alert('请输入三个数字'); return; }
        let inner = convert(n1, 8), outer = convert(n2, 8), yao = convert(n3, 6);
        let r = getHexData(inner, outer, yao);
        if (r) showResult(r, [n1, n2, n3]); else alert('未找到此卦');
    }
    function queryDirect() {
        let inner = parseInt(document.getElementById('inner').value), outer = parseInt(document.getElementById('outer').value), yao = parseInt(document.getElementById('yao').value);
        if (!inner || !outer || yao === undefined) { alert('请选择完整'); return; }
        let r = getHexData(inner, outer, yao);
        if (r) showResult(r);
    }
    function addHistory(r, nums) {
        let h = JSON.parse(localStorage.getItem('bagua_history') || '[]');
        h.unshift({ index: r.index, name: r.name, yao: r.yao_name || '卦辞', content: r.content.substring(0,20), nums: nums });
        if (h.length > 10) h = h.slice(0, 10);
        localStorage.setItem('bagua_history', JSON.stringify(h));
        renderHistory();
    }
    function renderHistory() {
        let h = JSON.parse(localStorage.getItem('bagua_history') || '[]');
        let el = document.getElementById('history');
        let html = '<button class="clear-btn" onclick="clearHistory()">清除历史</button>';
        h.forEach(item => {
            let numsStr = item.nums ? ' ('+item.nums.join(',')+')' : '';
            html += '<div class="history-item" onclick="location.reload()"><div class="history-name">'+item.name+numsStr+'</div><div class="history-yao">'+item.yao+': '+item.content+'...</div></div>';
        });
        el.innerHTML = html;
    }
    function clearHistory() { localStorage.removeItem('bagua_history'); renderHistory(); }
    initSelects(); renderHistory();
    </script>
</body>
